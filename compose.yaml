x-app: &app
  image: asacx
  build:
    context: .
    target: dev
  volumes:
    - .:/app
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    cache:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  migrate:
    <<: *app
    restart: "no"
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy
  server:
    <<: *app
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
  channel-worker:
    <<: *app
    command: watchmedo auto-restart --directory=/app --ignore-pattern=*sqlite3 --pattern=*.py --recursive -- python manage.py custom_runworker *
    environment:
      - ANSWER_VALIDATORS
      - ANSWER_VALIDATION_TIMEOUT
      - OLLAMA_MODEL
    deploy:
      mode: replicated
      replicas: 3
  ollama:
    image: ollama/ollama:0.34.4
    profiles: [llm]
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama:/root/.ollama
  ollama-pull:
    image: ollama/ollama:0.34.4
    profiles: [llm]
    restart: "no"
    environment:
      - OLLAMA_HOST=ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:1.5b}"]
    depends_on:
      - ollama
  cache:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: django_password
      POSTGRES_USER: django_user
      POSTGRES_DB: django_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U django_user -d django_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  ollama:
