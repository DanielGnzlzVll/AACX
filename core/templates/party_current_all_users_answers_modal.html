<div id="modal" hx-target="#modal">
  <dialog id="modal_dialog" {{ open }}>
    <article class="reveal">
      <header class="reveal-header">
        <span class="letter-tile">{{ current_round.letter }}</span>
        <h3>{{ field }}</h3>
      </header>
      <table>
        <thead>
          <tr>
            <th>Jugador</th>
            <th>Respuesta</th>
            <th class="points-cell">Puntos obtenidos</th>
          </tr>
        </thead>
        <tbody>
          {% for answer in answers %}
          <tr>
            <td>{{ answer.username }}</td>
            <td>{{ answer.value|default:"-" }}</td>
            <td class="points-cell"><span class="points-badge{% if not answer.scored_points %} is-zero{% endif %}">{{ answer.scored_points|default_if_none:"0" }}</span></td>
          </tr>
          {% empty %}
          <tr>
            <td colspan="3" class="empty-row">Nadie respondió esta categoría.</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </article>
  </dialog>
</div>
