<div id="modal">
  <dialog id="modal_dialog" {{ open }}>
    <article class="player-answers">
      <h3>Respuestas de {{ player.username }}</h3>
      <div class="table-scroll">{% include "party_answers.html" %}</div>
      <footer>
        <button
          type="button"
          onclick="this.closest('dialog').close()"
          class="secondary"
        >
          Cerrar
        </button>
      </footer>
    </article>
  </dialog>
</div>
