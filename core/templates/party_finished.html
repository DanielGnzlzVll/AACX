<article id="party_finished" class="party-finished">
  <h2>Partida terminada</h2>
  {% if winners %}
  <p class="winners-label">{% if winners|length > 1 %}Ganadores{% else %}Ganador{% endif %}</p>
  <p class="winners">{{ winners|join:", " }}</p>
  {% endif %}
  <a href="{% url 'home' %}" role="button">Volver al inicio</a>
</article>
