<h2 class="reports-heading">Reportes</h2>
<hr class="reports-divider">
<h3 class="reports-subheading">Letra actual</h3>
<div id="current_round_letter">
  <p class="current-letter">{{ current_round.letter|upper }}</p>
</div>
<hr class="reports-divider">
{% include "_round_countdown.html" %}
<h3 class="reports-subheading">Puntos por jugador</h3>
<div id="party_points">
  <table>
    <thead>
      <tr>
        <th class="reports-title"><strong>Jugador</strong></th>
        <th class="reports-title"><strong>Puntos</strong></th>
      </tr>
    </thead>
    <tbody>
      {% for user_name, points in players_scores.items %}
      <tr
        hx-get="{% url 'party_answers' party.id user_name %}"
        hx-target="#modal"
        hx-swap="outerHTML transition:true"
        class="party_reports_row"
      >
        <td class="reports-username">
          <button type="button" class="reports-user-button" title="Ver respuestas de {{ user_name }}">
            <span aria-hidden="true">&#x25BA;</span> {{ user_name }}
          </button>
        </td>
        <td class="reports-points">{{ points|default_if_none:"0" }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="2" class="empty-row">Aún no hay puntos.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
<hr class="reports-divider">
